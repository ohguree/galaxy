<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>우리 은하 3D 뷰어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#fff8ec; --ink:#4a4570; --mint:#bdf0dc; --pink:#ffc8dd; --yellow:#ffe8a3; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas.dragging{cursor:grabbing}
  .card{position:fixed;background:var(--cream);border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.5);padding:12px 18px;user-select:none}
  #title{top:16px;left:16px}
  #title h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.5px}
  #title p{margin:2px 0 0;font-size:13px;opacity:.75}
  #info{left:50%;bottom:92px;transition:bottom .2s;transform:translateX(-50%);font-size:15px;text-align:center;max-width:min(92vw,520px);line-height:1.45}
  #bar2{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);display:none;gap:8px;user-select:none}
  #bar2.show{display:flex}
  #bar2 button{font:inherit;font-size:15px;color:var(--ink);border:3px solid var(--cream);border-radius:999px;padding:7px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.5);white-space:nowrap;background:#e3d8ff}
  #bar2 button.on{outline:3px solid #fff;outline-offset:2px}
  #b-earth{background:#c9ecff}
  #bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;user-select:none}
  #bar button{font:inherit;font-size:17px;color:var(--ink);border:3px solid var(--cream);border-radius:999px;padding:10px 20px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.5);transition:transform .08s, box-shadow .08s;white-space:nowrap}
  #bar button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
  #bar button.on{outline:3px solid #fff;outline-offset:2px}
  #b-top{background:var(--mint)} #b-side{background:var(--pink)} #b-tilt{background:var(--yellow)}
  body.earth #info{bottom:132px}
  @media (max-width:480px){
    #bar2 button{padding:6px 10px;font-size:14px}
    #bar button{padding:9px 13px;font-size:15px}
    #title h1{font-size:19px}
    #info{font-size:14px;bottom:86px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card" id="title">
  <h1>🌌 우리 은하</h1>
  <p>지름 30,000 pc · 태양까지 8,500 pc</p>
  <p>드래그로 회전 · 휠/핀치로 확대</p>
</div>
<div class="card" id="info"></div>
<div id="bar">
  <button id="b-top">⬆️ 위에서 보기</button>
  <button id="b-side">➡️ 옆에서 보기</button>
  <button id="b-tilt">✨ 비스듬히</button>
  <button id="b-earth">🌍 지구</button>
</div>
<div id="bar2">
  <button id="b-summer">☀️ 여름</button>
  <button id="b-winter">❄️ 겨울</button>
  <button id="b-spin">▶ 공전</button>
</div>

(function(){
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  const tex=document.getElementById('tex');
  const D2R=Math.PI/180;
  let W=0,H=0,DPR=1;

  /* 규격: 은하 반지름 15,000 pc = 1 단위 */
  const SUN_R = 8500/15000;          // 0.567
  const IMG_HALF = 1.09;             // 이미지 절반 폭이 차지하는 단위 (원반 가장자리 = 1)
  const DISK_HALF_THICK = 0.012;     // 원반 반두께(약 180pc, 보기 좋게 약간 과장)
  const SUN=[0, SUN_R, 0];           // 그림 기준 중심 바로 아래 (오리온 팔 쪽)

  /* 카메라 */
  let yaw=0, pitch=90*D2R, zoom=1;
  let tPitch=null, vYaw=0, vPitch=0, dragging=false, tZoom=null;
  let fx=0, fy=0, OX=0, OY=0;            // 화면 중심에 둘 은하 평면 좌표
  let earthMode=false, phi=0, spin=true, tPhi=null;
  const ER=0.11;                          // 지구 공전 반지름(과장)

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR;
  }
  addEventListener('resize',resize); resize();

  // 은하 평면 좌표(x: 오른쪽, y: 그림 아래쪽, z: 위) → 화면
  function proj(x,y,z,S){
    const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
    const x1=x*cy-y*sy, y1=x*sy+y*cy;
    return [OX+x1*S, OY+(y1*sp - z*cp)*S];
  }

  function pill(text,x,y,bg,fg,size){
    ctx.font=(size||15)+"px 'Jua',sans-serif";
    const w=ctx.measureText(text).width+18, h=(size||15)+11;
    ctx.fillStyle=bg; ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x-w/2,y-h/2,w,h,h/2); else ctx.rect(x-w/2,y-h/2,w,h);

    ctx.fillText(text,x,y+1);
  }

  /* 사진에서 별 입자 추출 (밝은 곳일수록 많이) */
  let P=null;
  function buildParticles(){
    const N=256, oc=document.createElement('canvas'); oc.width=oc.height=N;
    const o=oc.getContext('2d'); o.drawImage(tex,0,0,N,N);
    const d=o.getImageData(0,0,N,N).data;
    const out=[]; let tries=0;
    while(out.length<26000*6 && tries<4e6){
      tries++;
      const px=Math.random()*N, py=Math.random()*N;
      const i=((py|0)*N+(px|0))*4;
      const r=d[i],g=d[i+1],b=d[i+2];
      const lum=(0.3*r+0.59*g+0.11*b)/255;
      if(Math.random()>lum*lum*1.3) continue;
      const x=(px/N*2-1)*IMG_HALF, y=(py/N*2-1)*IMG_HALF;
      const rr=Math.hypot(x,y);
      const bul=Math.max(0,1-rr/0.22);
      const sz=DISK_HALF_THICK*0.9 + 0.13*Math.pow(bul,1.3);
      const z=gauss()*sz;
      // 색은 살짝 밝게
      out.push(x,y,z, Math.min(255,r*1.15), Math.min(255,g*1.15), Math.min(255,b*1.15));
    }
    P=new Float32Array(out);
  }
  function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
  if(tex.complete && tex.naturalWidth) buildParticles(); else tex.onload=buildParticles;

  const t0=performance.now();
  function frame(now){
    const t=(now-t0)/1000;
    if(tPitch!==null){ pitch+=(tPitch-pitch)*0.12; if(Math.abs(tPitch-pitch)<0.002){pitch=tPitch;tPitch=null;} }
    else if(!dragging){ yaw+=vYaw; pitch+=vPitch; vYaw*=0.93; vPitch*=0.93; }
    pitch=Math.max(0,Math.min(90*D2R,pitch));
    if(tZoom!==null){ zoom+=(tZoom-zoom)*0.1; if(Math.abs(tZoom-zoom)<0.005){zoom=tZoom;tZoom=null;} }
    const tfx=earthMode?SUN[0]:0, tfy=earthMode?SUN[1]:0;
    fx+=(tfx-fx)*0.1; fy+=(tfy-fy)*0.1;

    const S=Math.min(W,H)*0.44*zoom;
    const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
    OX=W/2-(fx*cy-fy*sy)*S; OY=H/2-(fx*sy+fy*cy)*sp*S;

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);

    if(tex.complete && tex.naturalWidth){
      // 원반을 여러 겹 쌓아 두께 표현 (옆에서 보면 납작한 띠)
      const N=7;
      ctx.globalCompositeOperation='lighter';
      for(let i=0;i<N;i++){
        const u=(i/(N-1))*2-1;                 // -1..1
        const z=u*DISK_HALF_THICK;
        const a=Math.exp(-u*u*1.6);            // 가운데 층이 가장 진함
        ctx.globalAlpha=a/(N*0.45)*Math.pow(sp,0.6);
        ctx.setTransform(DPR*S*cy, DPR*S*sp*sy, -DPR*S*sy, DPR*S*sp*cy, DPR*OX, DPR*(OY - z*cp*S));
        ctx.drawImage(tex,-IMG_HALF,-IMG_HALF,IMG_HALF*2,IMG_HALF*2);
      }
      // 사진에서 뽑은 별 입자 (옆에서 볼수록 또렷하게)
      ctx.setTransform(DPR,0,0,DPR,0,0);
      const pa=Math.pow(cp,2.2);
      if(P && pa>0.02){
        const hw=OX, hh=OY, psz=Math.max(1.1,1.6*Math.min(zoom,2));
        let last='';
        ctx.globalAlpha=0.5*pa;
        for(let i=0;i<P.length;i+=6){
          const x=P[i],y=P[i+1],z=P[i+2];
          const x1=x*cy-y*sy, y1=x*sy+y*cy;
          const col='rgb('+(P[i+3]|0)+','+(P[i+4]|0)+','+(P[i+5]|0)+')';
          if(col!==last){ ctx.fillStyle=col; last=col; }
          ctx.fillRect(hw+x1*S-psz/2, hh+(y1*sp-z*cp)*S-psz/2, psz, psz);
        }
        ctx.globalAlpha=1;
      }
      // 중심 팽대부(타원체): 가로 0.19, 세로(두께) 0.09
      ctx.globalCompositeOperation='lighter';
      const c0=proj(0,0,0,S);
      const rx=0.20*S, rz=Math.sqrt(Math.pow(0.20*sp,2)+Math.pow(0.13*cp,2))*S;
      const bulgeA=0.2+0.9*cp;               // 위에서 볼 때는 그림의 막대가 있으니 약하게
      const bg=ctx.createRadialGradient(0,0,0,0,0,1);
      bg.addColorStop(0,'rgba(255,240,205,'+(0.95*bulgeA).toFixed(2)+')');
      bg.addColorStop(0.45,'rgba(255,225,170,'+(0.55*bulgeA).toFixed(2)+')');
      bg.addColorStop(1,'rgba(255,215,150,0)');
      ctx.setTransform(DPR*rx,0,0,DPR*rz,DPR*c0[0],DPR*c0[1]);
      ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(0,0,1,0,6.283); ctx.fill();
    }

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;

    // 중심–태양 거리선과 표시
    const c0=proj(0,0,0,S), sP=proj(SUN[0],SUN[1],SUN[2],S);
    ctx.strokeStyle='rgba(255,248,236,.75)'; ctx.lineWidth=2; ctx.setLineDash([6,6]);
    ctx.beginPath(); ctx.moveTo(c0[0],c0[1]); ctx.lineTo(sP[0],sP[1]); ctx.stroke(); ctx.setLineDash([]);
    const pulse=1+0.25*Math.sin(t*3);
    ctx.strokeStyle='rgba(255,236,160,.95)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(sP[0],sP[1],10*pulse,0,6.283); ctx.stroke();
    ctx.fillStyle='#ffe27a'; ctx.beginPath(); ctx.arc(sP[0],sP[1],5,0,6.283); ctx.fill();
    pill('☀️ 태양계',sP[0],sP[1]+26,'#fff8ec','#4a4570');
    const dist=Math.hypot(sP[0]-c0[0],sP[1]-c0[1]);
    const mx=(c0[0]+sP[0])/2, my=(c0[1]+sP[1])/2;
    if(dist>70) pill('8,500 pc',mx+34,my,'#ffe8a3','#4a4570');
    else { const dir=Math.sign(sP[0]-c0[0])||1; pill('8,500 pc ↔',c0[0]+dir*(dist/2),c0[1]-60,'#ffe8a3','#4a4570'); }
    pill('은하 중심',c0[0],c0[1]-30,'rgba(255,248,236,.92)','#4a4570');

    /* ---------- 지구 공전 (스케일 과장) ---------- */
    let season=null;
    if(earthMode){
      if(tPhi!==null){ let d=tPhi-phi; d=Math.atan2(Math.sin(d),Math.cos(d)); phi+=d*0.12; if(Math.abs(d)<0.01){phi=tPhi;tPhi=null;} }
      else if(spin) phi+=0.012;
      // phi=0 → 지구가 은하 중심 쪽(여름), π → 바깥쪽(겨울). 중심은 태양에서 -y 방향
      const ex=SUN[0]+ER*Math.sin(phi), ey=SUN[1]-ER*Math.cos(phi);
      const eP=proj(ex,ey,0,S);
      // 궤도
      ctx.strokeStyle='rgba(255,248,236,.55)'; ctx.lineWidth=1.5; ctx.setLineDash([4,5]);
      ctx.beginPath();
      for(let i=0;i<=72;i++){ const a=i/72*6.283; const q=proj(SUN[0]+ER*Math.sin(a),SUN[1]-ER*Math.cos(a),0,S); i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }
      ctx.stroke(); ctx.setLineDash([]);
      // 여름/겨울 위치 표시
      const pSum=proj(SUN[0],SUN[1]-ER,0,S), pWin=proj(SUN[0],SUN[1]+ER,0,S);
      [[pSum,'☀️ 여름 위치','#ffe8a3',-1],[pWin,'❄️ 겨울 위치','#c9ecff',1]].forEach(([q,tx,c,sg])=>{
        ctx.fillStyle=c; ctx.beginPath(); ctx.arc(q[0],q[1],4,0,6.283); ctx.fill();
        if(Math.hypot(q[0]-eP[0],q[1]-eP[1])>16) pill(tx,q[0]+sg*62,q[1],c,'#4a4570',13);
      });
      // 밤하늘 시야(태양 반대쪽) 부채꼴
      const dx=sP[0]-eP[0], dy=sP[1]-eP[1], L=Math.hypot(dx,dy)||1;
      const ax=-dx/L, ay=-dy/L, ang=Math.atan2(ay,ax);
      const toward=Math.cos(phi);                     // +1 중심 쪽, -1 바깥쪽
      const fc=toward>0?'255,210,90':'120,200,255';
      const cg=ctx.createRadialGradient(eP[0],eP[1],8,eP[0],eP[1],90);
      cg.addColorStop(0,'rgba('+fc+',0.55)'); cg.addColorStop(1,'rgba('+fc+',0)');
      ctx.fillStyle=cg;
      ctx.beginPath(); ctx.moveTo(eP[0],eP[1]); ctx.arc(eP[0],eP[1],90,ang-0.5,ang+0.5); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba('+fc+',0.8)'; ctx.lineWidth=1.5; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(eP[0],eP[1]); ctx.lineTo(eP[0]+Math.cos(ang-0.5)*90,eP[1]+Math.sin(ang-0.5)*90);
      ctx.moveTo(eP[0],eP[1]); ctx.lineTo(eP[0]+Math.cos(ang+0.5)*90,eP[1]+Math.sin(ang+0.5)*90); ctx.stroke(); ctx.setLineDash([]);
      pill('밤하늘 시야',eP[0]+Math.cos(ang)*104,eP[1]+Math.sin(ang)*104,'rgba('+fc+',0.9)','#4a4570',12);
      // 지구 (밤쪽 반구는 어둡게)
      const r=9;
      ctx.fillStyle='#6fb7ff'; ctx.beginPath(); ctx.arc(eP[0],eP[1],r,0,6.283); ctx.fill();
      ctx.fillStyle='#8fd18a'; ctx.beginPath(); ctx.arc(eP[0]-3,eP[1]-2,3.2,0,6.283); ctx.fill();
      ctx.fillStyle='rgba(20,22,60,.78)'; ctx.beginPath(); ctx.arc(eP[0],eP[1],r,ang-Math.PI/2,ang+Math.PI/2); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#fff8ec'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(eP[0],eP[1],r,0,6.283); ctx.stroke();
      pill('🌍 지구',eP[0]+Math.cos(ang+Math.PI/2)*52,eP[1]+Math.sin(ang+Math.PI/2)*52,'#fff8ec','#4a4570',13);
      season = toward>0.5?'summer': toward<-0.5?'winter':'mid';
    }

    // 지름 눈금 (위에서 볼 때만)
    if(sp>0.9){
      const L=proj(-1,-1.06,0,S), R=proj(1,-1.06,0,S);
      ctx.strokeStyle='rgba(255,248,236,'+((sp-0.9)/0.1*0.8).toFixed(2)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(L[0],L[1]); ctx.lineTo(R[0],R[1]); ctx.stroke();
      [L,R].forEach(p=>{ctx.beginPath(); ctx.moveTo(p[0],p[1]-7); ctx.lineTo(p[0],p[1]+7); ctx.stroke();});
      ctx.globalAlpha=(sp-0.9)/0.1;
      pill('지름 30,000 pc',(L[0]+R[0])/2,(L[1]+R[1])/2-22,'#bdf0dc','#4a4570');
      ctx.globalAlpha=1;
    }

    const deg=pitch/D2R, info=document.getElementById('info');
    let msg;
    if(season==='summer') msg='☀️ <b>여름(6월) 밤</b> — 지구의 밤쪽이 <b>은하 중심(궁수자리)</b>을 향해요<br>→ 별이 빽빽한 쪽을 보니 은하수가 넓고 밝아요';
    else if(season==='winter') msg='❄️ <b>겨울(12월) 밤</b> — 지구의 밤쪽이 <b>은하 바깥(오리온자리)</b>을 향해요<br>→ 별이 적은 쪽을 보니 은하수가 가늘고 희미해요';
    else if(season==='mid') msg='🌍 지구가 공전 중 · 밤쪽(어두운 반구)이 어디를 향하는지 보세요';
    else if(deg>=70) msg='⬆️ <b>위에서 본 모습</b><br>중심의 막대와 소용돌이 나선팔이 보여요';
    else if(deg<=12) msg='➡️ <b>옆에서 본 모습</b><br>지름 30,000 pc인데 두께는 약 300 pc뿐! 아주 납작해요';
    else msg='✨ 비스듬히 보는 중 · 드래그로 방향을 바꿔보세요';
    if(info._m!==msg){ info.innerHTML=msg; info._m=msg; }
    setActive(deg>=88?'top':deg<=2?'side':null);
    b2.summer.classList.toggle('on',earthMode&&season==='summer'&&!spin);
    b2.winter.classList.toggle('on',earthMode&&season==='winter'&&!spin);
    b2.spin.classList.toggle('on',earthMode&&spin);
    requestAnimationFrame(frame);
  }

  /* 입력 */
  let lx=0, ly=0; const ptrs=new Map(); let pinchD=0;
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===1){ dragging=true; lx=e.clientX; ly=e.clientY; vYaw=vPitch=0; tPitch=null; cv.classList.add('dragging'); }
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a[0]-b[0],a[1]-b[1]); }
  });
  cv.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,[e.clientX,e.clientY]);
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
      if(pinchD>0){ tZoom=null; zoom=Math.max(.5,Math.min(3,zoom*d/pinchD)); } pinchD=d; return; }
    if(!dragging) return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    vYaw=dx*0.0075; vPitch=dy*0.0055; yaw+=vYaw; pitch+=vPitch;
  });
  function up(e){ ptrs.delete(e.pointerId); pinchD=0; if(!ptrs.size){ dragging=false; cv.classList.remove('dragging'); } }
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); tZoom=null; zoom=Math.max(.5,Math.min(3,zoom*Math.exp(-e.deltaY*0.0012))); },{passive:false});

  const btn={top:document.getElementById('b-top'),side:document.getElementById('b-side'),tilt:document.getElementById('b-tilt')};
  function setActive(k){ for(const key in btn) btn[key].classList.toggle('on',key===k); }
  function go(p){ vYaw=vPitch=0; tPitch=p*D2R; }
  btn.top.onclick=()=>go(90); btn.side.onclick=()=>go(0); btn.tilt.onclick=()=>go(55);
  const bE=document.getElementById('b-earth'), bar2=document.getElementById('bar2');
  const b2={summer:document.getElementById('b-summer'),winter:document.getElementById('b-winter'),spin:document.getElementById('b-spin')};
  bE.onclick=()=>{
    earthMode=!earthMode; bE.classList.toggle('on',earthMode); bar2.classList.toggle('show',earthMode); document.body.classList.toggle('earth',earthMode);
    if(earthMode){ tZoom=2.2; go(90); spin=true; tPhi=null; } else { tZoom=1; }
  };
  b2.summer.onclick=()=>{ spin=false; tPhi=0; };
  b2.winter.onclick=()=>{ spin=false; tPhi=Math.PI; };
  b2.spin.onclick=()=>{ spin=true; tPhi=null; };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
